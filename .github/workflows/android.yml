name: Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: latest
      - name: Pasang NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
      - name: Build library Rust
        run: |
          cargo install cargo-ndk
          cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release -p uk-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ukmm-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
